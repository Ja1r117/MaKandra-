<!--
  partials/modal-reset-password.html
  ────────────────────────────────────
  Triggered programmatically by main.js when the user follows a
  password-reset link. No close button — the overlay is dismissed
  by JS after a successful save.
-->
<div id="reset-pw-overlay" class="overlay hidden">
  <div class="modal" id="reset-pw-modal">
    <div class="modal-body">
      <div class="modal-hero-text">
        <h2>Nieuw wachtwoord</h2>
        <p>Voer je nieuwe wachtwoord in</p>
      </div>
      <div class="form-group">
        <label>Nieuw wachtwoord</label>
        <input type="password" id="reset-pw-input" placeholder="Minimaal 6 tekens" />
      </div>
      <div class="form-group">
        <label>Bevestig wachtwoord</label>
        <input type="password" id="reset-pw-confirm" placeholder="Herhaal wachtwoord" />
      </div>
      <div class="form-error hidden" id="reset-pw-error"></div>
      <div id="reset-pw-success" class="hidden" style="color:#4caf50;font-size:.85rem;margin-bottom:8px"></div>
      <button class="btn-primary btn-full" onclick="handleResetPassword()">Wachtwoord opslaan</button>
    </div>
  </div>
</div>
